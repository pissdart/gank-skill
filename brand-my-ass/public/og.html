<!doctype html><meta charset="utf-8"><title>og</title>
<link rel="stylesheet" href="/styles.css">
<style>
body{width:1200px;height:630px;overflow:hidden;background:#fff}
.og{display:grid;grid-template-columns:1fr 520px;height:630px;align-items:center;padding:0 0 0 72px}
.og h1{margin:18px 0 0;font-size:118px;line-height:.87;letter-spacing:-.075em;font-weight:650}
.og p{margin:26px 0 0;color:var(--muted);font-size:20px;line-height:1.5;max-width:520px}
.og .pill{display:inline-flex;margin-top:30px;border-radius:999px;padding:14px 20px;background:var(--ink);color:#fff;font-size:15px;font-weight:700}
.body-viewer{width:520px;height:630px;aspect-ratio:auto}
</style>
<div class="og">
  <div>
    <span class="overline" style="font-size:14px"><i class="live-dot"></i>A real, live auction · Permanent ink</span>
    <h1>Your brand on my ass.</h1>
    <p>Ten tattoo placements. Every slot opens at $1,500. Winners get inked, permanently.</p>
    <span class="pill">brand-my-ass.pages.dev</span>
  </div>
  <div class="body-viewer" id="v"></div>
</div>
<script type="module" src="/og.js"></script>
